  - id: manifest_tools
    title: Manifest / Diff
    title_ru: Manifest / Diff
    description: Build Source -> Target diff lists from the current Workbench paths and apply them safely.
    description_ru: 'Конвейер Source -> Target по текущим путям Workbench: выбрать расширения, построить Diff и применить его копированием или mirror.'
    parameters:
      extension_field: manifest_extensions
      extension_groups: *id001
    fields:
      - id: source_dir
        type: path_history
        label: Source
        label_ru: Источник
        role: source
        default: ''
      - id: target_dir
        type: path_history
        label: Target
        label_ru: Цель
        role: target
        default: ''
      - id: mode
        type: mode_buttons
        label: Compare mode
        label_ru: Режим сравнения
        span: full
        tooltip: "Choose how Source and Target manifests are compared before Diff/apply actions."
        tooltip_ru: "Выберите, как сравнивать Source и Target перед построением Diff и применением маршрута."
        default: safe
        options:
          - value: quick
            label: QUICK
            label_ru: БЫСТРО
            tooltip: "Fast manifest diff: size and modification time decide most matches. Use when speed matters more than deep verification."
            tooltip_ru: "Быстрый Diff по манифестам: в основном размер и время изменения. Подходит, когда важнее скорость, чем глубокая сверка."
          - value: strict
            label: STRICT
            label_ru: СТРОГО
            tooltip: "Deepest comparison: hashes equal-size files even when timestamps match. Slowest, but catches quiet content changes."
            tooltip_ru: "Самая глубокая сверка: хешируются файлы одинакового размера даже при совпавшем времени. Медленнее, зато ловит тихие изменения содержимого."
          - value: safe
            label: SAFE
            label_ru: НАДЁЖНО
            tooltip: "Default cautious mode: metadata first, hashes only where equal-size files need confirmation."
            tooltip_ru: "Штатный осторожный режим: сначала метаданные, хеши только там, где файлам одинакового размера нужна проверка."
      - id: diff_file
        type: text
        label: Diff path list override
        label_ru: Готовый список Diff
        hint: Optional. Empty value uses the latest list generated by Diff source/target.
        hint_ru: Необязательно. Пустое значение использует последний список, созданный Diff источника/цели.
        span: full
        default: ''
      - <<: *manual_extension_field
        id: manifest_extensions
        label: Manifest extension filter
        label_ru: Фильтр расширений Manifest/Diff
        hint: Empty selection scans all files. Selected groups or extensions narrow Diff and Source/Target __CHECKSUMS__.b3 creation.
        hint_ru: Пустой выбор считает все файлы. Выбранные группы или расширения сужают Diff и создание __CHECKSUMS__.b3 для источника/цели.
        extension_filter: true
    children:
      - id: diff_then_sync_manifest
        title: Diff + One-Way Sync
        title_ru: DIFF + ONE-WAY SYNC
        description: Recalculate Source -> Target diff, then copy/update only files from the fresh one-way diff list. Target-only files stay untouched.
        description_ru: Пересчитать Diff Source -> Target и сразу скопировать/обновить только файлы из свежего one-way списка. Лишнее в цели не трогается.
        service: system_core.services.disk_auditor_service:run_manifest_diff_then_apply_command
        kind: safe
        parameters:
          manifest_section: pipeline
          cli_command: sync
      - id: diff_then_backup_manifest
        title: Diff + BACKUP-MIRROR
        title_ru: DIFF + BACKUP-MIRROR
        description: Recalculate Source -> Target diff, then mirror only paths from the fresh mirror diff list. Target-only paths inside the diff may be removed.
        description_ru: Пересчитать Diff Source -> Target и применить mirror только по свежему mirror-списку. Лишние пути цели внутри Diff могут удаляться.
        service: system_core.services.disk_auditor_service:run_manifest_diff_then_apply_command
        kind: dangerous
        parameters:
          manifest_section: pipeline
          cli_command: backup
      - id: diff_source_target_manifest
        title: Diff source/target
        title_ru: ТОЛЬКО DIFF
        description: Build relative-path diff lists for current Source -> Target without changing files.
        description_ru: Сформировать списки относительных путей различий Source -> Target без изменения файлов.
        service: system_core.services.disk_auditor_service:run_manifest_diff_command
        kind: safe
        parameters:
          manifest_section: review
      - id: sync_from_manifest_diff
        title: One-Way from diff
        title_ru: ONE-WAY ПО DIFF
        description: Copy/update only files from the latest one-way diff list. Target-only files stay untouched.
        description_ru: Скопировать/обновить только файлы из последнего one-way diff-списка. Лишнее в цели не трогается.
        service: system_core.services.disk_auditor_service:run_manifest_diff_apply_command
        kind: safe
        parameters:
          manifest_section: review
          cli_command: sync
      - id: backup_from_manifest_diff
        title: BACKUP-MIRROR from diff
        title_ru: BACKUP-MIRROR ПО DIFF
        description: Apply Source -> Target mirror only inside the latest mirror diff path list.
        description_ru: Применить Source -> Target mirror только внутри последнего mirror diff-списка путей.
        service: system_core.services.disk_auditor_service:run_manifest_diff_apply_command
        kind: dangerous
        parameters:
          manifest_section: review
          cli_command: backup
      - id: create_source_manifest
        title: Create source __CHECKSUMS__.b3
        title_ru: Создать источник
        description: Create __CHECKSUMS__.b3 inside the current Workbench source. This standalone checksum file is not required for Diff + One-Way.
        description_ru: Создать __CHECKSUMS__.b3 внутри текущего источника Workbench. Это отдельный checksum-файл, не обязательный для Diff + One-Way.
        service: system_core.services.disk_auditor_service:run_manifest_command
        kind: safe
        parameters:
          manifest_section: checksums
          cli_command: manifest
          root_role: source
      - id: create_target_manifest
        title: Create target __CHECKSUMS__.b3
        title_ru: Создать цель
        description: Create __CHECKSUMS__.b3 inside the current Workbench target for standalone audit or later verification.
        description_ru: Создать __CHECKSUMS__.b3 внутри текущей цели Workbench для отдельного аудита или последующей проверки.
        service: system_core.services.disk_auditor_service:run_manifest_command
        kind: safe
        parameters:
          manifest_section: checksums
          cli_command: manifest
          root_role: target
      - id: verify_source_manifest
        title: Verify source __CHECKSUMS__.b3
        title_ru: Проверить источник
        description: Verify files in the current Workbench source against its __CHECKSUMS__.b3.
        description_ru: Проверить файлы текущего источника Workbench по его __CHECKSUMS__.b3.
        service: system_core.services.disk_auditor_service:run_manifest_command
        kind: safe
        parameters:
          manifest_section: checksums
          cli_command: verify
          root_role: source
      - id: verify_target_manifest
        title: Verify target __CHECKSUMS__.b3
        title_ru: Проверить цель
        description: Verify files in the current Workbench target against its __CHECKSUMS__.b3.
        description_ru: Проверить файлы текущей цели Workbench по её __CHECKSUMS__.b3.
        service: system_core.services.disk_auditor_service:run_manifest_command
        kind: safe
        parameters:
          manifest_section: checksums
          cli_command: verify
          root_role: target
  - id: diagnostics
    title: Diagnostics
    title_ru: Диагностика
    description: Read-only CLI checks.
    description_ru: Read-only проверки CLI.
    children:
      - id: diag_info
        title: Project info
        title_ru: Информация о проекте
        description: Show CLI runtime and config paths.
        description_ru: Показать runtime CLI и пути конфигурации.
        service: system_core.services.disk_auditor_service:run_info
        kind: safe
        parameters: {}
      - id: diag_pairs
        title: List profiles
        title_ru: Список профилей
        description: Print configured sync profiles/pairs.
        description_ru: Показать сохранённые профили/pairs.
        service: system_core.services.disk_auditor_service:list_pairs
        kind: safe
        parameters: {}
maintenance_operations:
  - id: cleanup_input_output
    title: Clear I/O
    title_ru: Очистить I/O
    description: Delete contents of managed input and output folders only.
    description_ru: Удалить содержимое только управляемых папок input и output.
    service: system_core.services.disk_auditor_service:cleanup_input_output
    kind: dangerous
    parameters: {}
  - id: clear_path_history
    title: Clear paths
    title_ru: Очистить пути
    description: Delete saved source/target path history.
    description_ru: Удалить сохранённую историю путей source/target.
    service: system_core.services.disk_auditor_service:clear_path_history
    kind: dangerous
    parameters: {}
  - id: cleanup_workspace
    title: Cleanup workspace
    title_ru: Очистить workspace
    description: Delete contents of the managed workspace folder only.
    description_ru: Удалить содержимое только управляемой папки workspace.
    service: system_core.services.disk_auditor_service:cleanup_workspace
