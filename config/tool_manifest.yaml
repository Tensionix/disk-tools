        tooltip_ru: "Выберите, как сравнивать файлы источника и приёмника перед копированием или mirror."
        default: safe
        options:
          - value: quick
            label: QUICK
            label_ru: БЫСТРО
            tooltip: "Fast metadata pass: size and modification time only. Best for a first scan of large trees."
            tooltip_ru: "Быстро: сравнение только по размеру и времени изменения. Хорошо для первичного прохода по большим деревьям."
          - value: safe
            label: SAFE
            label_ru: НАДЁЖНО
            tooltip: "Default cautious mode: checks size/time first, then hashes equal-size files when timestamps differ."
            tooltip_ru: "Штатно и осторожно: размер и время проверяются быстро, а файлы одинакового размера с разным временем дополнительно сверяются по хешу."
