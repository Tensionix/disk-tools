tool:
  id: audion_disk_auditor
  name: Audion Disk Tools
  category: Disk tools
  version: 1.0.0-gui
paths:
  input: input
  output: output
  logs: logs
  report: report
  workspace: workspace
  config: config
  release: release
ui:
  title: Audion Disk Tools
  host: 127.0.0.1
  port: 8080
  native: false
  reload: false
  open_browser: false
operations:
  - id: info
    title: Project info
    title_ru: Информация о проекте
    description: Show CLI runtime and config paths.
    description_ru: Показать runtime CLI и пути конфигурации.
    service: system_core.services.disk_auditor_service:run_info
    kind: safe
    parameters: {}
operation_groups:
  - id: manual_backup_apply
    title: FOLDER TO FOLDER
    title_ru: ПАПКА В ПАПКУ
    description: 'One source, one target, one of four operations: backup mirror, one-way, two-way, or a comparison report.
      They ran the same service through the same fields and differed by a single word, so they were three sections.
      This is the auditor''s own run — BLAKE3 comparison, the quarantine policy and the comparison report,
      none of which the transfer builder does. For a list of machines, clouds or a server, use DATA TRANSFER.'
    description_ru: 'Источник, приёмник и одна из четырёх операций: зеркало, односторонняя, двусторонняя или отчёт о расхождениях.
      Все они работали одним сервисом через одни поля и отличались единственным словом — потому и были тремя разделами.
      Это прогон самого аудитора: сверка BLAKE3, карантин и отчёт о расхождениях, чего трансфер не делает.
      Список машин, облака и сервер — в разделе ТРАНСФЕР ДАННЫХ.'
    service: system_core.services.disk_auditor_service:run_manual_command
    kind: dangerous
